[project]
name = "worker"
version = "0.1.0"
description = "Agent de surveillance bourse/crypto : MM200 semaines + criteres Buffett, alertes par e-mail"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.19.0",
    "yfinance>=0.2.40",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
